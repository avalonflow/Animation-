<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvalonFlow / Kairos Assistant</title>
    <style>
        /* Base page layout */
        html, body {
            height: 100%;
        }

        body {
            font-family: Georgia, serif;
            background-color: #0b0b16;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* -------- Floating Background -------- */
        #floating-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at bottom, #cfe8ff, #ffffff);
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatParticles linear infinite;
            background: rgba(120, 180, 255, 0.7);
            box-shadow: 0 0 10px #8ec5ff, 0 0 20px #b7dcff;
        }

        @keyframes floatParticles {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ================ Header Logo Card Neon ============== */
        .minimal-logo-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0 10px 0; 
            width: 100%;
            margin-top: -82px; 
            background: transparent !important;
            z-index: 1;
        }

        .logo-shimmer-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            overflow: hidden;
            background: transparent !important;
        }

        .avalon-logo-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(0.40);
            transform-origin: center center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0.9; 
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.05));
            mix-blend-mode: multiply; 
            background: transparent !important;
            border: none !important;            
            outline: none !important;
        }

        /* ================ Theme Variables (Foundation Palette) ============== */
        :root {
            --glass-bg: rgba(15, 23, 42, 0.35);
            --glass-border: rgba(255, 255, 255, 0.08);

            --gemini-blue: #3b82f6;
            --gemini-purple: #a855f7;
            --gemini-cyan: #06b6d4;
            --neon-glow: rgba(59, 130, 246, 0.35); 

            --user-bubble-bg: linear-gradient(135deg, rgba(59, 130, 246, 0.85), rgba(99, 102, 241, 0.85));
            --kairos-bubble-bg: rgba(255, 255, 255, 0.06);
        }

        /* 1. Master Container & Sizing Controllers */
        .assistant-dock-wrap {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 100%;
            max-width: 380px; 
            padding: 0 16px;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .assistant-dock-wrap.expanded {
            max-width: 500px;
        }

        .assistant-dock-wrap.full-height {
            bottom: 20px;
            max-width: 520px;
            height: calc(100vh - 40px);
        }

        /* 2. Glass Morphic Shield */
        .glass-dock {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid var(--glass-border);
            border-radius: 40px; 
            padding: 12px 24px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: auto;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .assistant-dock-wrap.full-height .glass-dock {
            height: 100%;
            border-radius: 28px;
        }

        .glass-dock::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                135deg, 
                rgba(6, 182, 212, 0.2), 
                rgba(59, 130, 246, 0.15), 
                rgba(168, 85, 247, 0.2), 
                rgba(6, 182, 212, 0.2)
            );
            background-size: 400% 400%; 
            z-index: 0;
            animation: fluidCloud 12s ease infinite;
            pointer-events: none;
        }

        @keyframes fluidCloud {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-dock:hover {
            border-color: rgba(6, 182, 212, 0.35);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6), 
                        0 0 20px var(--neon-glow);
        }

        .assistant-dock-wrap.expanded .glass-dock {
            border-radius: 24px;
            padding: 20px;
            cursor: default;
        }

        /* 3. View Containers */
        .dock-collapsed-view, .dock-expanded-view {
            position: relative;
            z-index: 1;
        }

        .dock-collapsed-view {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
        }

        .dock-expanded-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            animation: contentReveal 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes contentReveal {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .status-indicator.active {
            width: 8px;
            height: 8px;
            background-color: var(--gemini-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gemini-cyan);
            flex-shrink: 0;
        }

        .dock-text {
            color: rgba(255, 255, 255, 0.92);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 4. Expanded Dock Header & Actions */
        .dock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .dock-header h4 {
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn.close-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        /* 5. Scrollable Chat Canvas */
        .voice-transcript-canvas {
            width: 100%;
            flex: 1;
            min-height: 120px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            scroll-behavior: smooth;
        }

        .assistant-dock-wrap.full-height .voice-transcript-canvas {
            max-height: none;
        }

        .voice-transcript-canvas::-webkit-scrollbar {
            width: 4px;
        }

        .voice-transcript-canvas::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* 6. Chat Bubbles */
        .chat-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
            animation: bubblePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bubblePop {
            0% { opacity: 0; transform: translateY(6px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: var(--user-bubble-bg);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .chat-bubble.kairos {
            align-self: flex-start;
            background: var(--kairos-bubble-bg);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .chat-bubble .speaker-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            opacity: 0.6;
        }

        .streaming-text {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        /* 7. Input Bar Component */
        .dock-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 6px 4px 14px;
            flex-shrink: 0;
        }

        .dock-input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
        }

        .dock-input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .action-icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .action-icon-btn.active-mic {
            color: var(--gemini-cyan);
            background: rgba(6, 182, 212, 0.2);
            box-shadow: 0 0 10px var(--gemini-cyan);
        }

        /* 8. Kinetic Audio Wave Engine */
        .audio-wave-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 20px;
            margin-left: auto; 
            flex-shrink: 0;
        }

        .audio-wave-pill .stroke {
            display: block;
            background: linear-gradient(to top, var(--gemini-cyan), var(--gemini-blue), var(--gemini-purple));
            height: 100%;
            width: 3px;
            border-radius: 10px;
            animation: dynamicPulse 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-origin: center;
        }

        .audio-wave-pill .stroke:nth-child(1) { --max-h: 0.5; animation-delay: 0.1s; animation-duration: 0.75s; }
        .audio-wave-pill .stroke:nth-child(2) { --max-h: 0.9; animation-delay: 0.25s; animation-duration: 0.9s; }
        .audio-wave-pill .stroke:nth-child(3) { --max-h: 0.6; animation-delay: 0.0s; animation-duration: 0.7s; }
        .audio-wave-pill .stroke:nth-child(4) { --max-h: 1.0; animation-delay: 0.4s; animation-duration: 1.1s; }
        .audio-wave-pill .stroke:nth-child(5) { --max-h: 0.4; animation-delay: 0.15s; animation-duration: 0.65s; }

        @keyframes dynamicPulse {
            0%, 100% { transform: scaleY(0.2); opacity: 0.6; }
            50% { transform: scaleY(var(--max-h)); opacity: 1; }
        }

        /* Utilities & Footer */
        .d-none { display: none !important; }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 18px 0;
            font-size: 14px;
            color: #555;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);
            z-index: 6;
        }
    </style>
</head>
<body>

    <div id="floating-bg"></div>

    <header class="minimal-logo-header">
        <div class="logo-shimmer-wrapper">
            <img src="assets/pictures/1780995787737.jpeg" alt="Avalon Logo" class="avalon-logo-img">
        </div>
    </header>

    <!-- Floating Assistant Glass Dock Container -->
    <div class="assistant-dock-wrap" id="dockWrap">
        <div class="glass-dock" id="glassDock">
            
            <!-- Collapsed State View -->
            <div class="dock-collapsed-view" id="collapsedView">
                <span class="status-indicator active"></span>
                <span class="dock-text">Kairos Assistant</span>
                <div class="audio-wave-pill">
                    <span class="stroke"></span>
                    <span class="stroke"></span>
                    <span class="stroke"></span>
                    <span class="stroke"></span>
                    <span class="stroke"></span>
                </div>
            </div>

            <!-- Expanded State View -->
            <div class="dock-expanded-view d-none" id="expandedView">
                <div class="dock-header">
                    <h4>Kairos Assistant</h4>
                    <div class="header-actions">
                        <button class="icon-btn" id="expandToggleBtn" aria-label="Toggle Fullscreen">⤢</button>
                        <button class="icon-btn close-btn" id="closeDockBtn" aria-label="Close Assistant">✕</button>
                    </div>
                </div>

                <!-- Chat Canvas -->
                <div class="voice-transcript-canvas" id="transcriptCanvas">
                    <div class="chat-bubble kairos">
                        <div class="speaker-label">Kairos</div>
                        <p class="streaming-text">Synchronization online. How can I assist you today?</p>
                    </div>
                </div>

                <!-- Input Component Bar -->
                <div class="dock-input-bar">
                    <input type="text" id="dockInput" placeholder="Message Kairos..." autocomplete="off">
                    <button class="action-icon-btn" id="dockMicBtn" aria-label="Voice Input">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <button class="action-icon-btn" id="dockSendBtn" aria-label="Send Message">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        AvalonFlow Interface System
    </footer>

    <script>
        // Interactive Dock Expansion Logic
        const dockWrap = document.getElementById('dockWrap');
        const glassDock = document.getElementById('glassDock');
        const collapsedView = document.getElementById('collapsedView');
        const expandedView = document.getElementById('expandedView');
        const closeDockBtn = document.getElementById('closeDockBtn');
        const expandToggleBtn = document.getElementById('expandToggleBtn');

        // Expand dock on clicking the collapsed view
        collapsedView.addEventListener('click', (e) => {
            dockWrap.classList.add('expanded');
            collapsedView.classList.add('d-none');
            expandedView.classList.remove('d-none');
        });

        // Close/Collapse dock
        closeDockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dockWrap.classList.remove('expanded', 'full-height');
            expandedView.classList.add('d-none');
            collapsedView.classList.remove('d-none');
        });

        // Toggle full screen / maximum height
        expandToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dockWrap.classList.toggle('full-height');
        });
    </script>
</body>
</html>
